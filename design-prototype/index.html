<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFBF8" />
  <meta name="description" content="Respaw full product design prototype" />
  <title>Respaw — Full App Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito+Sans:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="prototype" class="prototype">
    <aside class="review-panel" aria-label="Prototype page selector">
      <div class="review-brand">
        <span class="review-mark">r<span>+</span></span>
        <div><strong>Respaw prototype</strong><small>57 product surfaces</small></div>
      </div>
      <label class="page-search"><span>Find a page</span><input id="pageSearch" type="search" placeholder="Search pages…" /></label>
      <nav id="pageIndex" class="page-index"></nav>
      <div class="review-note">Design prototype only<br />No real medical or payment actions</div>
    </aside>

    <main class="device-stage">
      <div id="device" class="device" aria-label="Respaw mobile app">
        <div id="screen" class="screen" tabindex="-1"></div>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
        <div id="modalRoot"></div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
